<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ISMB 2026 Session Finder</title>
    <link rel="stylesheet" href="./styles.css?v=4" />
  </head>
  <body>
    <main class="app-shell">
      <section class="search-panel" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">Session Finder</p>
          <h1 id="page-title">ISMB 2026</h1>
          <p class="subtitle">
            Search titles, abstracts, authors, and keywords by topic, time,
            track, or room.
          </p>
          <a class="schedule-link" href="./schedule.html">
            <span class="cal" aria-hidden="true">📅</span>
            <span>View full conference schedule</span>
            <span class="arrow" aria-hidden="true">→</span>
          </a>
        </div>

        <form id="search-form" class="search-form">
          <label for="query">Keyword query</label>
          <div class="search-row">
            <input
              id="query"
              name="query"
              type="search"
              autocomplete="off"
              placeholder="Search by keyword"
            />
            <button type="submit">Search</button>
          </div>
        </form>

        <section class="hot-keywords" aria-label="Hot keywords">
          <div class="hot-keywords-title">Hot Keywords</div>
          <div id="hot-keywords-list" class="hot-keywords-list"></div>
        </section>

        <section class="filters" aria-label="Search filters">
          <label for="type-filter">Type</label>
          <select id="type-filter">
            <option value="all">Talks &amp; posters</option>
            <option value="talk">Talks only</option>
            <option value="poster">Posters only</option>
          </select>

          <label for="track-filter">Track</label>
          <select id="track-filter"></select>

          <label for="room-filter">Room</label>
          <select id="room-filter"></select>

          <label for="sort-select">Sort results</label>
          <select id="sort-select">
            <option value="relevance">Relevance</option>
            <option value="time">Time</option>
            <option value="track">Track</option>
          </select>
        </section>

        <form id="time-form" class="time-form">
          <label for="date-select">Find sessions by time</label>
          <div class="time-grid">
            <select id="date-select" name="date"></select>
            <select id="time-select" name="time"></select>
          </div>
          <button type="submit">Show Sessions</button>
        </form>

        <div class="action-grid">
          <button id="now-button" type="button">What Should I Attend Now?</button>
          <button id="schedule-button" type="button">My Schedule</button>
        </div>
      </section>

      <section class="answer-panel" aria-live="polite">
        <div id="status" class="status">Loading schedule...</div>
        <div id="answer" class="answer"></div>
        <div id="results" class="results"></div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
